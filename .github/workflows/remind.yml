# Save this in your repo as .github/workflows/remind.yml
name: Vet records reminder

on:
  schedule:
    - cron: "30 8 */3 * *" # Runs at 08:30, every 3 days

  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      log_level:
        description: "Log level for this run (DEBUG also lists every skipped record)"
        type: choice
        options: [INFO, DEBUG, WARN, ERROR]
        default: INFO

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python remind.py
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
          JOTFORM_FORM_ID: ${{ secrets.JOTFORM_FORM_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DATE_ADOPTED_QID: ${{ secrets.DATE_ADOPTED_QID }}
          NOTES_QID: ${{ secrets.NOTES_QID }}
          STATUS_QID: ${{ secrets.STATUS_QID }}
          RECORDS_QID: ${{ secrets.RECORDS_QID }}   # optional; unset = remind until Status changes
          STATUS_VALUE: Adopted   # must match the status option text in your form
          # manual run: the option picked; scheduled run: the LOG_LEVEL repo variable, else INFO
          LOG_LEVEL: ${{ inputs.log_level || vars.LOG_LEVEL || 'INFO' }}
