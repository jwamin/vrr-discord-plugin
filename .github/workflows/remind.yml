# Save this in your repo as .github/workflows/remind.yml
name: Vet records reminder

on:
  # GitHub schedule disabled for now. Scheduled runs started 4-9 hours late (e.g. a
  # 9am New York run arriving around 4:40pm), so the run is started from a Mac via
  # launchd instead: see launchd/ (Mon/Wed/Fri 8:30am New York time, retries until 10am).
  # To go back to GitHub's schedule, uncomment this block. Don't use both at once, or
  # each Mon/Wed/Fri gets two reminders.
  # schedule:
  #   - cron: "17 8 * * 1,3,5"   # Mon/Wed/Fri 08:17, off :00 where GitHub delays most
  #     timezone: "America/New_York"

  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      log_level:
        description: "Log level for this run (DEBUG also lists every skipped record)"
        type: choice
        options: [default, INFO, DEBUG, WARN, ERROR]
        default: default   # "default" = the LOG_LEVEL repo variable, else INFO

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python remind.py | tee "$RUNNER_TEMP/remind.log"
        shell: bash   # adds pipefail, so a script failure still fails the step despite tee
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
          JOTFORM_FORM_ID: ${{ secrets.JOTFORM_FORM_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DATE_ADOPTED_QID: ${{ secrets.DATE_ADOPTED_QID }}
          NOTES_QID: ${{ secrets.NOTES_QID }}
          STATUS_QID: ${{ secrets.STATUS_QID }}
          RECORDS_QID: ${{ secrets.RECORDS_QID }}   # optional; unset = remind until Status changes
          STATUS_VALUE: Adopted   # must match the status option text in your form
          # the option picked when run by hand; otherwise (launchd, schedule) the
          # LOG_LEVEL repo variable, else INFO
          LOG_LEVEL: ${{ (inputs.log_level != 'default' && inputs.log_level) || vars.LOG_LEVEL || 'INFO' }}

      # Phone/desktop notification via ntfy.sh on every run. Skipped if NTFY_TOPIC is unset.
      # Only counts are sent (from the script's own log), never notes or cat names.
      - name: Notify ntfy.sh
        if: always()
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "NTFY_TOPIC not set, skipping"; exit 0; }
          if [ "$JOB_STATUS" = "success" ]; then
            title="Vet reminder ran"; priority=default; tags=white_check_mark
            # last Summary line plus the sent / nothing-overdue line, without timestamp and level
            msg=$(grep -E 'Summary:|Reminder sent|Nothing overdue' "$RUNNER_TEMP/remind.log" \
                  | sed -E 's/^[^ ]+ [A-Z]+ +//' || true)
          else
            title="Vet reminder FAILED"; priority=high; tags=rotating_light
            msg="Job status: $JOB_STATUS. Tap to open the run log."
          fi
          curl -fsS --retry 2 -o /dev/null \
            -H "Title: $title" -H "Priority: $priority" -H "Tags: $tags" -H "Click: $RUN_URL" \
            -d "${msg:-No summary found in the log.}" \
            "https://ntfy.sh/$NTFY_TOPIC" || echo "::warning::ntfy notification failed"
